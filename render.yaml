databases:
  - name: ecole-db
    plan: free
    databaseName: ecole
    user: ecole

services:
  - type: web
    name: ecole-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecole-db
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://ecole-web.onrender.com
      - key: STORAGE_PATH
        value: /data/uploads
    disk:
      name: uploads
      mountPath: /data/uploads
      sizeGB: 1

  - type: worker
    name: ecole-worker
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    plan: free
    envVars:
      - key: API_URL
        fromService:
          name: ecole-api
          type: web
          property: hostport
          envVarKey: API_URL

  - type: web
    name: ecole-web
    runtime: static
    buildCommand: cd web && corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./web/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ecole-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
