services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecole
      POSTGRES_USER: ecole
      POSTGRES_PASSWORD: ecole_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecole"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://ecole:ecole_dev@db:5432/ecole?sslmode=disable
      STORAGE_PATH: /data/uploads
      CORS_ORIGIN: http://localhost:5173
      ENCRYPTION_KEY: dev-encryption-key-change-in-prod
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

  worker:
    build:
      context: ./worker
    environment:
      API_URL: http://api:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    volumes:
      - model_cache:/root/.cache/huggingface
      - uploads:/data/uploads
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  model_cache:
