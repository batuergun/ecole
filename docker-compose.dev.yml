services:
  api:
    build:
      context: ./api
      target: dev
    volumes:
      - ./api:/app
    command: go run ./cmd/server

  web:
    build:
      context: ./web
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./web/src:/app/src
    command: pnpm dev --host

  worker:
    volumes:
      - ./worker:/app
    command: python -m worker.main --dev
